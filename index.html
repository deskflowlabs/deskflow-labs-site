<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskflow Labs</title>
<meta name="description" content="Deskflow Labs が公開しているアプリとツールの一覧です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fbfbfe; --card:#fff; --ink:#23233a; --sub:#5c5c73; --faint:#9a9ab0;
    --accent:#6f5cf0; --accent-soft:#efedfc; --line:#e9e9f2;
    --jp:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
    --num:'Sora',-apple-system,'Helvetica Neue',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--jp); line-height:1.85; -webkit-text-size-adjust:100%; }
  .wrap { max-width:820px; margin:0 auto; padding:0 22px; }
  a { color:var(--accent); }

  header { padding:76px 0 52px; text-align:center; }
  .brand { font-family:var(--num); font-size:32px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px; }
  .brand .dot { color:var(--accent); }
  /* ▼ サイトの説明文。自由に書き換えてください ▼ */
  .tagline { font-size:16px; color:var(--sub); margin:0; }

  section { padding-bottom:64px; }
  h2 { font-size:14px; font-weight:700; color:var(--faint); letter-spacing:.12em; margin:0 0 16px; }

  .products { display:flex; flex-direction:column; gap:14px; }
  .product {
    display:flex; align-items:center; gap:20px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px 24px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .product:hover { border-color:#cfc7f7; transform:translateY(-2px); }
  .thumb { width:64px; height:64px; border-radius:17px; flex-shrink:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .thumb.iq { background:linear-gradient(135deg,#6f5cf0 0%,#8b78fb 100%); box-shadow:0 10px 22px rgba(111,92,240,.3); }
  .thumb.iq span { font-family:var(--num); font-size:28px; font-weight:800; color:#fff; position:relative; z-index:2; }
  .thumb.iq i { position:absolute; background:rgba(255,255,255,.14); }
  .thumb.iq .v1{left:21px;top:0;width:1px;height:64px}.thumb.iq .v2{left:42px;top:0;width:1px;height:64px}
  .thumb.iq .h1{top:21px;left:0;height:1px;width:64px}.thumb.iq .h2{top:42px;left:0;height:1px;width:64px}
  .thumb.tool { background:#eef0f6; border:1px solid var(--line); }
  .thumb.tool span { font-family:var(--num); font-size:24px; font-weight:700; color:#6b7089; }
  .info { flex:1; min-width:0; }
  .info h3 { font-size:18px; font-weight:900; margin:0 0 3px; }
  .info p { font-size:14px; color:var(--sub); margin:0; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .chip { font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .chip.grey { background:#f0f1f5; color:#6b7089; }
  .arrow { color:var(--faint); font-size:20px; flex-shrink:0; }

  footer { border-top:1px solid var(--line); padding:30px 0 60px; text-align:center; font-size:14px; color:var(--faint); }
  footer nav { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  footer a { text-decoration:none; font-weight:700; }
  footer a:hover { text-decoration:underline; }

  @media (max-width:560px) {
    header { padding:56px 0 40px; }
    .brand { font-size:26px; }
    .product { gap:15px; padding:18px; }
    .thumb { width:54px; height:54px; border-radius:14px; }
    .thumb.iq span { font-size:23px; }
    .info h3 { font-size:16px; }
    .arrow { display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 class="brand">Deskflow Labs<span class="dot">.</span></h1>
    <p class="tagline">アプリとツールをつくっています。</p>
  </div>
</header>

<section>
  <div class="wrap">
    <h2>PRODUCTS</h2>
    <div class="products">

      <a class="product" href="/sudoku-iq/">
        <div class="thumb iq">
          <i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i>
          <span>IQ</span>
        </div>
        <div class="info">
          <h3>ナンプレIQ</h3>
          <p>難易度そのものがIQ値。解くほどに「認定IQ」が上がっていくナンプレ(数独)アプリ。</p>
          <div class="meta">
            <span class="chip">iPhone / iPad</span>
            <span class="chip grey">近日公開</span>
          </div>
        </div>
        <span class="arrow">›</span>
      </a>

      <!-- ▼ 不要であれば、この <a> ブロックごと削除してください ▼ -->
      <a class="product" href="https://github.com/deskflowlabs/windows-copy-paste-mode" target="_blank" rel="noopener">
        <div class="thumb tool"><span>⌘</span></div>
        <div class="info">
          <h3>Windows Copy Paste Mode</h3>
          <p>Cursor / VS Code のコピー&amp;ペーストをワンクリックで Windows 風に。書式なしコピペ・ターミナル安全貼り付けに対応。</p>
          <div class="meta">
            <span class="chip grey">VS Code 拡張</span>
            <span class="chip grey">オープンソース</span>
          </div>
        </div>
        <span class="arrow">›</span>
      </a>

    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <nav>
      <a href="/sudoku-iq/">ナンプレIQ</a>
      <a href="/sudoku-iq/support/">サポート</a>
      <a href="/sudoku-iq/privacy/">プライバシーポリシー</a>
    </nav>
    Deskflow Labs
  </div>
</footer>

</body>
</html>
